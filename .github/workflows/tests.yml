name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # report every version, don't stop at the first
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[test]"
      - run: pytest -q

  sdist:
    name: pytest from a built sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install build pytest
      - run: python -m build --sdist

      # Install from the sdist, then run the suite out of the unpacked sdist
      # with its source tree deleted, so both the tests and the barcodeEZ being
      # imported come from the built artifact and never from the checkout.
      # The editable job above cannot see a packaging gap -- the files are
      # already in the working tree. This is what catches a MANIFEST.in miss
      # (conftest.py, tests/data/*.csv) or a corpus/*.fa.gz that fell out of
      # package-data, which would break barcodeEZ at import for every user.
      - name: Test from the sdist
        run: |
          pip install dist/*.tar.gz
          mkdir /tmp/sdist
          tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          rm -rf /tmp/sdist/barcodeEZ
          cd /tmp/sdist
          python -c "import barcodeEZ; print('importing from', barcodeEZ.__file__)"
          pytest -q
