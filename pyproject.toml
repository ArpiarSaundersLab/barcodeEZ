[build-system]
requires = [
    "setuptools"
]

[project]
name = "barcodeEZ"
version = "0.1"
authors = [
    {name="Zach Goode"},
    {email="goodez@ohsu.edu"}
]
requires-python = ">=3.8"
dependencies = [
    "biopython >= 1.81",
    "rapidfuzz >= 3.9.6",
]

readme = "README.md"

[project.urls]
repository = "https://github.com/barcodeEZ/barcodeEZ"

[tool.setuptools]
packages = ["barcodeEZ"]

[tool.setuptools.package-data]
my_package = ["bc_gen/*.fa.gz"]
