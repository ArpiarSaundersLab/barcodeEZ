[build-system]
requires = [
    "setuptools"
]

[project]
name = "barcodeEZ"
version = "1.0.0"
description = "Design combinatorially barcoded oligo libraries for cloning"
authors = [
    {name="Zach Goode", email="goodez@ohsu.edu"}
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["barcode", "oligo", "cloning", "synthetic-biology", "sequencing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython >= 1.81",
    "pandas"
]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs <2", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
repository = "https://github.com/ArpiarSaundersLab/barcodeEZ"
documentation = "https://arpiarsaunderslab.github.io/barcodeEZ/"

[tool.setuptools]
packages = ["barcodeEZ"]

[tool.setuptools.package-data]
barcodeEZ = ["corpus/*.fa.gz"]
